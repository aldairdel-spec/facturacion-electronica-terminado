# ============================================================
# Configuracion de Base de Datos - JDBC puro sin HikariCP
# ============================================================

# Driver PostgreSQL
database.driver=org.postgresql.Driver

# Opcion 1: URL completa
database.url=jdbc:postgresql://localhost:5432/Facturacion_db

# Opcion 2: partes separadas (se usa si database.url esta vacia)
database.host=localhost
database.port=5432
database.name=Facturacion_db

# Credenciales
database.user=postgres
database.password=210820

# ============================================================
# Configuracion Vaadin
# ============================================================
vaadin.launch-browser=true
vaadin.productionMode=false

# ============================================================
# Servidor
# ============================================================
server.port=8080

# ============================================================
# Logs
# ============================================================
logging.config=classpath:logback.xml
